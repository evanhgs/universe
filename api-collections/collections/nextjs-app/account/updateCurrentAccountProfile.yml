info:
  name: Account - Update Current Profile
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{url}}/api/account/me/profile"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{clerkSessionToken}}
      disabled: true
  body:
    type: json
    data: |-
      {
        "displayName": "Seed Seller Updated",
        "bio": "Test profile update from /account-test.",
        "city": "Paris",
        "countryCode": "FR",
        "isPublic": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
