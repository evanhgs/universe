info:
  name: Account - Get Current Profile
  type: http
  seq: 2

http:
  method: GET
  url: "{{url}}/api/account/me/profile"
  headers:
    - name: Authorization
      value: Bearer {{clerkSessionToken}}
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
