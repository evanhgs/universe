info:
  name: Account - Update Current Roles
  type: http
  seq: 5

http:
  method: PUT
  url: "{{url}}/api/account/me/roles"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{url}}"
    - name: Referer
      value: "{{url}}/"
  body:
    type: json
    data: |-
      {
        "roles": ["BUYER", "SELLER"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
