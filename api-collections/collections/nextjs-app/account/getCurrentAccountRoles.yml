info:
  name: Account - Get Current Roles
  type: http
  seq: 4

http:
  method: GET
  url: "{{url}}/api/account/me/roles"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{url}}"
    - name: Referer
      value: "{{url}}/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
