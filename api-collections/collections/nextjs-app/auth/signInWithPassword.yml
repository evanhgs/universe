info:
  name: Clerk - Sign In (Password)
  type: http
  seq: 1

http:
  method: POST
  url: "{{clerkFrontendApiUrl}}/v1/client/sign_ins"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{url}}"
  body:
    type: json
    data: |-
      {
        "identifier": "{{clerkIdentifier}}",
        "strategy": "password",
        "password": "{{clerkPassword}}"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
