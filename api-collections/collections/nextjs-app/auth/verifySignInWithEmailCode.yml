info:
  name: Clerk - Sign In (Email Code Verify)
  type: http
  seq: 3

http:
  method: POST
  url: "{{clerkFrontendApiUrl}}/v1/client/sign_ins/{{clerkSignInId}}/attempt_first_factor"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{url}}"
  body:
    type: json
    data: |-
      {
        "strategy": "email_code",
        "code": "{{clerkEmailCode}}"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
