info:
  name: Marketplace - Create Stripe Checkout
  type: http
  seq: 5

http:
  method: POST
  url: "{{url}}/api/marketplace/orders/{{marketplaceOrderId}}/checkout/stripe"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "successUrl": "{{url}}/account/purchases?orderId={{marketplaceOrderId}}&stripeSessionId={CHECKOUT_SESSION_ID}",
        "cancelUrl": "{{url}}/account/purchases?orderId={{marketplaceOrderId}}&checkout=cancelled"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
