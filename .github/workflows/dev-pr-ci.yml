name: Dev PR CI

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: dev-pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
  CLERK_SECRET_KEY: sk_test_dummy
  CLERK_WEBHOOK_SIGNING_SECRET: whsec_dummy
  STRIPE_SECRET_KEY: sk_test_dummy
  STRIPE_WEBHOOK_SECRET: whsec_dummy
  DATABASE_URL: postgresql://universe:universe@localhost:5432/universe_ci

jobs:
  detect_changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ai_services: ${{ steps.changed_files.outputs.ai_services }}
      audio_worker: ${{ steps.changed_files.outputs.audio_worker }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changed_files
        run: |
          changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"

          if printf '%s\n' "$changed_files" | grep -q '^ai-services/'; then
            echo "ai_services=true" >> "$GITHUB_OUTPUT"
          else
            echo "ai_services=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$changed_files" | grep -q '^audio-worker/'; then
            echo "audio_worker=true" >> "$GITHUB_OUTPUT"
          else
            echo "audio_worker=false" >> "$GITHUB_OUTPUT"
          fi

  app-checks:
    name: App checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

  ai-services-checks:
    name: AI services checks
    needs: detect_changes
    if: needs.detect_changes.outputs.ai_services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-services
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: ai-services/.python-version

      - name: Setup uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
          cache-dependency-glob: ai-services/uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

  audio-worker-checks:
    name: Audio worker checks
    needs: detect_changes
    if: needs.detect_changes.outputs.audio_worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: audio-worker
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --check
