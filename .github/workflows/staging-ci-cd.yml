name: Staging CI/CD

on:
  pull_request:
    branches:
      - staging
  push:
    branches:
      - staging

permissions:
  contents: read

env:
  APP_URL: http://staging.example.test
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
  CLERK_SECRET_KEY: sk_test_dummy
  CLERK_WEBHOOK_SIGNING_SECRET: whsec_dummy
  STRIPE_SECRET_KEY: sk_test_dummy
  STRIPE_WEBHOOK_SECRET: whsec_dummy
  DATABASE_URL: postgresql://universe:universe@postgres:5432/universe_staging?schema=public

jobs:
  validate-staging-pr-source:
    name: Validate staging PR source
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require dev source branch
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "Only pull requests from dev to staging are allowed." >&2
            echo "Current source branch: ${{ github.head_ref }}" >&2
            exit 1
          fi

  app-checks:
    name: App checks
    if: github.event_name == 'pull_request'
    needs: validate-staging-pr-source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: staging-pr-app-checks-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

  ai-services-checks:
    name: AI services checks
    if: github.event_name == 'pull_request'
    needs: validate-staging-pr-source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: staging-pr-ai-services-checks-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ai-services
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ai-services/.python-version

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ai-services/uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Compile
        run: uv run python -m compileall main.py

      - name: Smoke test API
        run: |
          uv run python - <<'PY'
          from main import app, health, root, version

          assert app.title == "ai services"
          assert app.version == "0.1.0"
          assert root() == {"api": "ai services"}
          assert health() == {"status": "ok"}
          assert version() == {"version": "0.1.0"}
          PY

      - name: Pytest
        run: |
          if find . -path './.venv' -prune -o -name '*test*.py' -print -quit | grep -q .; then
            uv run pytest -q
          else
            echo "No pytest tests found yet."
          fi

  audio-worker-checks:
    name: Audio worker checks
    if: github.event_name == 'pull_request'
    needs: validate-staging-pr-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: staging-pr-audio-worker-checks-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: audio-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: audio-worker -> target

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  staging-compose-build:
    name: Staging Compose build
    if: github.event_name == 'pull_request'
    needs:
      - app-checks
      - ai-services-checks
      - audio-worker-checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: staging-pr-compose-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      COMPOSE_PROGRESS: plain
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI staging env
        run: |
          cat > "$RUNNER_TEMP/stack.staging.ci.env" <<'EOF'
          COMPOSE_PROJECT_NAME=universe-staging-ci
          APP_ENV=staging
          APP_URL=http://staging.example.test
          AI_SERVICES_URL=
          CLERK_AUTHORIZED_PARTIES=http://staging.example.test
          CLERK_PROXY_DEBUG=0
          S3_PUBLIC_ENDPOINT=https://s3-staging.example.test
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_dummy
          CLERK_SECRET_KEY=sk_test_dummy
          CLERK_WEBHOOK_SIGNING_SECRET=whsec_dummy
          STRIPE_SECRET_KEY=sk_test_dummy
          STRIPE_WEBHOOK_SECRET=whsec_dummy
          STRIPE_AUTOMATIC_TAX_ENABLED=false
          NEXTJS_CONTEXT=../app
          NEXTJS_DOCKERFILE=../app/Dockerfile
          NEXTJS_IMAGE=universe/nextjs
          NEXTJS_IMAGE_TAG=staging-ci
          NEXTJS_NODE_ENV=production
          NEXTJS_HOSTNAME=0.0.0.0
          NEXTJS_PORT=3000
          NEXTJS_TELEMETRY_DISABLED=1
          NEXTJS_PROXY_HTTP_PORT=8080
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmn
          DATABASE_URL=postgresql://universe:universe@postgres:5432/universe_staging?schema=public
          POSTGRES_DB=universe_staging
          POSTGRES_USER=universe
          POSTGRES_PASSWORD=universe
          AI_SERVICES_CONTEXT=../ai-services
          AI_SERVICES_DOCKERFILE=../ai-services/Dockerfile
          AI_SERVICES_IMAGE=universe/ai-services
          AI_SERVICES_IMAGE_TAG=staging-ci
          AI_SERVICES_PORT=8000
          AI_SERVICES_PYTHONDONTWRITEBYTECODE=1
          AI_SERVICES_PYTHONUNBUFFERED=1
          S3_REGION=us-east-1
          S3_BUCKET_BEATS=universe-staging-ci-beats
          S3_ACCESS_KEY_ID=dummy
          S3_SECRET_ACCESS_KEY=dummy
          S3_FORCE_PATH_STYLE=true
          AUDIO_WORKER_CONTEXT=../audio-worker
          AUDIO_WORKER_DOCKERFILE=../audio-worker/Dockerfile
          AUDIO_WORKER_IMAGE=universe/audio-worker
          AUDIO_WORKER_IMAGE_TAG=staging-ci
          AUDIO_WORKER_ID=staging-ci-audio-worker-1
          AUDIO_WORKER_POLL_INTERVAL_MS=2000
          AUDIO_WORKER_TMP_DIR=/tmp/universe-audio-worker
          AUDIO_WORKER_TMPFS_SIZE=1g
          AUDIO_WORKER_RUST_LOG=info
          EOF

      - name: Validate staging Compose config
        run: docker compose -f infra/compose.staging.yml --env-file "$RUNNER_TEMP/stack.staging.ci.env" config --quiet

      - name: Build staging images
        run: docker compose -f infra/compose.staging.yml --env-file "$RUNNER_TEMP/stack.staging.ci.env" build nextjs ai-services audio-worker

  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    steps:
      - name: Validate SSH secrets
        env:
          STAGING_PROJECT_PATH: ${{ secrets.STAGING_PROJECT_PATH }}
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          missing=0

          for name in \
            STAGING_PROJECT_PATH \
            STAGING_SSH_HOST \
            STAGING_SSH_KNOWN_HOSTS \
            STAGING_SSH_PORT \
            STAGING_SSH_PRIVATE_KEY \
            STAGING_SSH_USER
          do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret: $name" >&2
              missing=1
            fi
          done

          exit "$missing"

      - name: Configure SSH
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_deploy_key
          chmod 600 ~/.ssh/staging_deploy_key
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on staging server
        env:
          STAGING_PROJECT_PATH: ${{ secrets.STAGING_PROJECT_PATH }}
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          ssh \
            -i ~/.ssh/staging_deploy_key \
            -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "bash -s" -- "$STAGING_PROJECT_PATH" <<'EOF'
          set -euo pipefail

          project_path="$1"

          cd "$project_path"
          git fetch --prune origin
          git checkout staging
          git pull --ff-only origin staging
          make staging
          make staging-prisma-push
          make staging-ps
          EOF
