name: ${COMPOSE_PROJECT_NAME:-universe-staging}

x-nextjs-runtime: &nextjs-runtime
  init: true
  restart: unless-stopped
  stop_signal: SIGTERM
  stop_grace_period: 30s
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "require('http').get('http://127.0.0.1:${NEXTJS_PORT:-3000}',res=>process.exit(res.statusCode<500?0:1)).on('error',()=>process.exit(1))",
      ]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - internal
    - edge

services:
  postgres:
    image: postgres:18-alpine
    init: true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-universe_staging}
      POSTGRES_USER: ${POSTGRES_USER:-universe}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_password
    volumes:
      - type: volume
        source: postgres_staging_data
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  nextjs:
    <<: *nextjs-runtime
    environment:
      APP_ENV: ${APP_ENV:-staging}
      APP_URL: ${APP_URL}
      AI_SERVICES_URL: ${AI_SERVICES_URL}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      STRIPE_AUTOMATIC_TAX_ENABLED: "${STRIPE_AUTOMATIC_TAX_ENABLED:-false}"
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET_BEATS: ${S3_BUCKET_BEATS}
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-true}"
      NODE_ENV: ${NEXTJS_NODE_ENV:-production}
      NEXT_TELEMETRY_DISABLED: "${NEXTJS_TELEMETRY_DISABLED:-1}"
      HOSTNAME: ${NEXTJS_HOSTNAME:-0.0.0.0}
      PORT: "${NEXTJS_PORT:-3000}"
    image: ${NEXTJS_IMAGE:-universe/nextjs}:${NEXTJS_IMAGE_TAG:-staging}
    build:
      context: ${NEXTJS_CONTEXT:-../app}
      dockerfile: ${NEXTJS_DOCKERFILE:-../app/Dockerfile}
      target: runner
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "${NEXTJS_PORT:-3000}"
    secrets:
      - next_server_actions_encryption_key
      - database_url
      - stripe_secret_key
      - stripe_webhook_secret
      - clerk_secret_key
      - clerk_webhook_signing_secret
      - s3_access_key_id
      - s3_secret_access_key
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY="$$(cat /run/secrets/next_server_actions_encryption_key)"
        DATABASE_URL="$$(cat /run/secrets/database_url)"
        STRIPE_SECRET_KEY="$$(cat /run/secrets/stripe_secret_key)"
        STRIPE_WEBHOOK_SECRET="$$(cat /run/secrets/stripe_webhook_secret)"
        CLERK_SECRET_KEY="$$(cat /run/secrets/clerk_secret_key)"
        CLERK_WEBHOOK_SIGNING_SECRET="$$(cat /run/secrets/clerk_webhook_signing_secret)"
        S3_ACCESS_KEY_ID="$$(cat /run/secrets/s3_access_key_id)"
        S3_SECRET_ACCESS_KEY="$$(cat /run/secrets/s3_secret_access_key)"
        export NEXT_SERVER_ACTIONS_ENCRYPTION_KEY DATABASE_URL STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET CLERK_SECRET_KEY CLERK_WEBHOOK_SIGNING_SECRET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY
        exec node server.js

  ai-services:
    init: true
    environment:
      PYTHONDONTWRITEBYTECODE: "${AI_SERVICES_PYTHONDONTWRITEBYTECODE:-1}"
      PYTHONUNBUFFERED: "${AI_SERVICES_PYTHONUNBUFFERED:-1}"
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:${AI_SERVICES_PORT:-8000}/health').status < 500 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
      - edge
    image: ${AI_SERVICES_IMAGE:-universe/ai-services}:${AI_SERVICES_IMAGE_TAG:-staging}
    build:
      context: ${AI_SERVICES_CONTEXT:-../ai-services}
      dockerfile: ${AI_SERVICES_DOCKERFILE:-../ai-services/Dockerfile}
      target: runner
    expose:
      - "${AI_SERVICES_PORT:-8000}"

  proxy:
    image: caddy:2.10-alpine
    init: true
    depends_on:
      nextjs:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /var/run:rw,noexec,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "${NEXTJS_PROXY_HTTP_PORT:-8080}:80"
    volumes:
      - type: bind
        source: ./proxy/Caddyfile.staging
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: caddy_staging_data
        target: /data
      - type: volume
        source: caddy_staging_config
        target: /config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge
      - internal

  proxy_ai_services:
    image: caddy:2.10-alpine
    init: true
    depends_on:
      ai-services:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /var/run:rw,noexec,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "${AI_SERVICES_PROXY_HTTP_PORT:-8010}:80"
    volumes:
      - type: bind
        source: ./proxy/Caddyfile.ai-staging
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: caddy_ai_staging_data
        target: /data
      - type: volume
        source: caddy_ai_staging_config
        target: /config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge
      - internal

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  postgres_staging_data:
  caddy_staging_data:
  caddy_staging_config:
  caddy_ai_staging_data:
  caddy_ai_staging_config:

secrets:
  postgres_password:
    file: ./secrets/staging/postgres_password.txt
  next_server_actions_encryption_key:
    file: ./secrets/staging/next_server_actions_encryption_key.txt
  database_url:
    file: ./secrets/staging/database_url.txt
  stripe_secret_key:
    file: ./secrets/staging/stripe_secret_key.txt
  stripe_webhook_secret:
    file: ./secrets/staging/stripe_webhook_secret.txt
  clerk_secret_key:
    file: ./secrets/staging/clerk_secret_key.txt
  clerk_webhook_signing_secret:
    file: ./secrets/staging/clerk_webhook_signing_secret.txt
  s3_access_key_id:
    file: ./secrets/staging/s3_access_key_id.txt
  s3_secret_access_key:
    file: ./secrets/staging/s3_secret_access_key.txt
