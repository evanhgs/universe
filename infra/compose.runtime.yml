name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME in the runtime env file}

x-runtime-defaults: &runtime-defaults
  init: true
  restart: unless-stopped
  stop_signal: SIGTERM
  stop_grace_period: 30s
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    init: true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in the runtime env file}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the runtime env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the runtime env file}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  redis:
    image: redis:8.6.3
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in the runtime env file}"]
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 15s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in the runtime env file}
    volumes:
      - type: volume
        source: redis_data
        target: /data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  nextjs:
    <<: *runtime-defaults
    image: ${NEXTJS_IMAGE:-universe/nextjs}:${NEXTJS_IMAGE_TAG:?set NEXTJS_IMAGE_TAG in the runtime env file}
    build:
      context: ${NEXTJS_CONTEXT:-../app}
      dockerfile: ${NEXTJS_DOCKERFILE:-../app/Dockerfile}
      target: runner
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:?set NEXT_PUBLIC_SENTRY_ENVIRONMENT in the runtime env file}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    environment:
      APP_ENV: ${APP_ENV:?set APP_ENV in the runtime env file}
      APP_URL: ${APP_URL:?set APP_URL in the runtime env file}
      AI_SERVICES_URL: ${AI_SERVICES_URL:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:?set CLERK_AUTHORIZED_PARTIES in the runtime env file}
      CLERK_TELEMETRY_DISABLED: "${CLERK_TELEMETRY_DISABLED:-1}"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY in the runtime env file}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:?set NEXT_PUBLIC_SENTRY_ENVIRONMENT in the runtime env file}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      STRIPE_AUTOMATIC_TAX_ENABLED: "${STRIPE_AUTOMATIC_TAX_ENABLED:-false}"
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?set S3_PUBLIC_ENDPOINT in the runtime env file}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET_BEATS: ${S3_BUCKET_BEATS:?set S3_BUCKET_BEATS in the runtime env file}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in the runtime env file}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in the runtime env file}
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-true}"
      SEED_BEAT_COUNT: ${SEED_BEAT_COUNT:-500}
      SEED_SELLER_COUNT: ${SEED_SELLER_COUNT:-40}
      SEED_ANALYTICS_EVENTS: ${SEED_ANALYTICS_EVENTS:-50000}
      SEED_BUYER_COUNT: ${SEED_BUYER_COUNT:-8}
      SEED_RANDOM_SEED: ${SEED_RANDOM_SEED:-20260605}
      SEED_AUDIO_BUCKET: ${SEED_AUDIO_BUCKET:-}
      SEED_AUDIO_OBJECT_KEY: ${SEED_AUDIO_OBJECT_KEY:-}
      NODE_ENV: ${NEXTJS_NODE_ENV:-production}
      NEXT_TELEMETRY_DISABLED: "${NEXTJS_TELEMETRY_DISABLED:-1}"
      WATCHPACK_POLLING: "${NEXTJS_WATCHPACK_POLLING:-false}"
      HOSTNAME: ${NEXTJS_HOSTNAME:-0.0.0.0}
      PORT: "${NEXTJS_PORT:-3000}"
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?set NEXT_SERVER_ACTIONS_ENCRYPTION_KEY in the runtime env file}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in the runtime env file}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY in the runtime env file}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?set STRIPE_WEBHOOK_SECRET in the runtime env file}
      STRIPE_UNIVERSE_MONTHLY_PRICE_ID: ${STRIPE_UNIVERSE_MONTHLY_PRICE_ID:?set STRIPE_UNIVERSE_MONTHLY_PRICE_ID in the runtime env file}
      UNIVERSE_PRICING_MONTHLY_LABEL: ${UNIVERSE_PRICING_MONTHLY_LABEL:-8,99 €/mois}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_EMAIL_FROM: ${RESEND_EMAIL_FROM:-}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in the runtime env file}
      CRON_ALLOWED_IPS: ${CRON_ALLOWED_IPS:?set CRON_ALLOWED_IPS in the runtime env file}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in the runtime env file}@redis:6379}
      REDIS_API_GLOBAL: ${REDIS_API_GLOBAL:-300}
      REDIS_ACCOUNT_WRITE: ${REDIS_ACCOUNT_WRITE:-20}
      REDIS_STORAGE_PRESIGN: ${REDIS_STORAGE_PRESIGN:-30}
      REDIS_MARKETPLACE_WRITE: ${REDIS_MARKETPLACE_WRITE:-30}
      REDIS_MARKETPLACE_READ: ${REDIS_MARKETPLACE_READ:-120}
      REDIS_ANALYTICS_WRITE: ${REDIS_ANALYTICS_WRITE:-240}
      REDIS_CHAT_WRITE: ${REDIS_CHAT_WRITE:-60}
      REDIS_CHAT_READ: ${REDIS_CHAT_READ:-180}
      REDIS_PUBLIC_ENUMERATION: ${REDIS_PUBLIC_ENUMERATION:-120}
      REDIS_ACCOUNT_TEST_BURST: ${REDIS_ACCOUNT_TEST_BURST:-8}
      RATE_LIMIT_TEST_ENABLED: "${RATE_LIMIT_TEST_ENABLED:-false}"
      SENTRY_TEST_ENABLED: "${SENTRY_TEST_ENABLED:-false}"
      EMAIL_TEST_ENABLED: "${EMAIL_TEST_ENABLED:-false}"
      ANALYTICS_TEST_ENABLED: "${ANALYTICS_TEST_ENABLED:-false}"
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY in the runtime env file}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:?set CLERK_WEBHOOK_SIGNING_SECRET in the runtime env file}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "${NEXTJS_PORT:-3000}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:${NEXTJS_PORT:-3000}',res=>process.exit(res.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
      - edge

  ai-services:
    <<: *runtime-defaults
    image: ${AI_SERVICES_IMAGE:-universe/ai-services}:${AI_SERVICES_IMAGE_TAG:?set AI_SERVICES_IMAGE_TAG in the runtime env file}
    build:
      context: ${AI_SERVICES_CONTEXT:-../ai-services}
      dockerfile: ${AI_SERVICES_DOCKERFILE:-../ai-services/Dockerfile}
      target: runner
    environment:
      PYTHONDONTWRITEBYTECODE: "${AI_SERVICES_PYTHONDONTWRITEBYTECODE:-1}"
      PYTHONUNBUFFERED: "${AI_SERVICES_PYTHONUNBUFFERED:-1}"
      AI_SERVICES_API_KEY: ${AI_SERVICES_API_KEY:?set AI_SERVICES_API_KEY in the runtime env file}
      AI_SERVICES_ALLOWED_ORIGINS: ${AI_SERVICES_ALLOWED_ORIGINS:-}
    expose:
      - "${AI_SERVICES_PORT:-8000}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:${AI_SERVICES_PORT:-8000}/health').status < 500 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

  audio-worker:
    <<: *runtime-defaults
    image: ${AUDIO_WORKER_IMAGE:-universe/audio-worker}:${AUDIO_WORKER_IMAGE_TAG:?set AUDIO_WORKER_IMAGE_TAG in the runtime env file}
    build:
      context: ${AUDIO_WORKER_CONTEXT:-../audio-worker}
      dockerfile: ${AUDIO_WORKER_DOCKERFILE:-../audio-worker/Dockerfile}
      target: runtime
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in the runtime env file}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?set S3_PUBLIC_ENDPOINT in the runtime env file}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET_BEATS: ${S3_BUCKET_BEATS:?set S3_BUCKET_BEATS in the runtime env file}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in the runtime env file}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in the runtime env file}
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-true}"
      AUDIO_WORKER_ID: ${AUDIO_WORKER_ID:?set AUDIO_WORKER_ID in the runtime env file}
      AUDIO_WORKER_POLL_INTERVAL_MS: ${AUDIO_WORKER_POLL_INTERVAL_MS:-2000}
      AUDIO_WORKER_TMP_DIR: ${AUDIO_WORKER_TMP_DIR:-/tmp/universe-audio-worker}
      RUST_LOG: ${AUDIO_WORKER_RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${AUDIO_WORKER_TMPFS_SIZE:-1g}
    networks:
      - internal

  proxy:
    image: caddy:2.10-alpine
    init: true
    depends_on:
      nextjs:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /var/run:rw,noexec,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "${NEXTJS_PROXY_HTTP_PORT:?set NEXTJS_PROXY_HTTP_PORT in the runtime env file}:80"
    volumes:
      - type: bind
        source: ./proxy/Caddyfile.runtime
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: caddy_data
        target: /data
      - type: volume
        source: caddy_config
        target: /config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge
      - internal

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
