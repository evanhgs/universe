name: ${COMPOSE_PROJECT_NAME:-universe-prod}

x-nextjs-runtime: &nextjs-runtime
  init: true
  restart: unless-stopped
  stop_signal: SIGTERM
  stop_grace_period: 30s
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "require('http').get('http://127.0.0.1:${NEXTJS_PORT:-3000}',res=>process.exit(res.statusCode<500?0:1)).on('error',()=>process.exit(1))",
      ]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  networks:
    - internal
    - edge

services:
  nextjs:
    <<: *nextjs-runtime
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_URL: ${APP_URL}
      AI_SERVICES_URL: ${AI_SERVICES_URL}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      STRIPE_AUTOMATIC_TAX_ENABLED: "${STRIPE_AUTOMATIC_TAX_ENABLED:-false}"
      NODE_ENV: ${NEXTJS_NODE_ENV:-production}
      NEXT_TELEMETRY_DISABLED: "${NEXTJS_TELEMETRY_DISABLED:-1}"
      HOSTNAME: ${NEXTJS_HOSTNAME:-0.0.0.0}
      PORT: "${NEXTJS_PORT:-3000}"
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:?set POSTMARK_SERVER_TOKEN in infra/env/stack.prod.env}
      POSTMARK_FROM_EMAIL: ${POSTMARK_FROM_EMAIL:?set POSTMARK_FROM_EMAIL in infra/env/stack.prod.env}
      POSTMARK_MESSAGE_STREAM: ${POSTMARK_MESSAGE_STREAM:-outbound}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in infra/env/stack.prod.env}
    image: ${NEXTJS_IMAGE:-universe/nextjs}:${NEXTJS_IMAGE_TAG:-prod}
    build:
      context: ${NEXTJS_CONTEXT:-../app}
      dockerfile: ${NEXTJS_DOCKERFILE:-../app/Dockerfile}
      target: runner
    expose:
      - "${NEXTJS_PORT:-3000}"
    secrets:
      - next_server_actions_encryption_key
      - database_url
      - stripe_secret_key
      - stripe_webhook_secret
      - clerk_secret_key
      - clerk_webhook_signing_secret
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY="$$(cat /run/secrets/next_server_actions_encryption_key)"
        DATABASE_URL="$$(cat /run/secrets/database_url)"
        STRIPE_SECRET_KEY="$$(cat /run/secrets/stripe_secret_key)"
        STRIPE_WEBHOOK_SECRET="$$(cat /run/secrets/stripe_webhook_secret)"
        CLERK_SECRET_KEY="$$(cat /run/secrets/clerk_secret_key)"
        CLERK_WEBHOOK_SIGNING_SECRET="$$(cat /run/secrets/clerk_webhook_signing_secret)"
        export NEXT_SERVER_ACTIONS_ENCRYPTION_KEY DATABASE_URL STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET CLERK_SECRET_KEY CLERK_WEBHOOK_SIGNING_SECRET
        exec node server.js

  ai-services:
    init: true
    environment:
      PYTHONDONTWRITEBYTECODE: "${AI_SERVICES_PYTHONDONTWRITEBYTECODE:-1}"
      PYTHONUNBUFFERED: "${AI_SERVICES_PYTHONUNBUFFERED:-1}"
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:${AI_SERVICES_PORT:-8000}/health').status < 500 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - internal
      - edge
    image: ${AI_SERVICES_IMAGE:-universe/ai-services}:${AI_SERVICES_IMAGE_TAG:-prod}
    build:
      context: ${AI_SERVICES_CONTEXT:-../ai-services}
      dockerfile: ${AI_SERVICES_DOCKERFILE:-../ai-services/Dockerfile}
      target: runner
    expose:
      - "${AI_SERVICES_PORT:-8000}"

  proxy:
    image: caddy:2.10-alpine
    init: true
    depends_on:
      nextjs:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /var/run:rw,noexec,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "${NEXTJS_PROXY_HTTP_PORT:-80}:80"
      - "${NEXTJS_PROXY_HTTPS_PORT:-443}:443"
    environment:
      CADDY_HOSTNAME: ${CADDY_HOSTNAME}
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - type: bind
        source: ./proxy/Caddyfile.prod
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: caddy_prod_data
        target: /data
      - type: volume
        source: caddy_prod_config
        target: /config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - edge
      - internal

  proxy_ai_services:
    image: caddy:2.10-alpine
    init: true
    depends_on:
      ai-services:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /var/run:rw,noexec,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "${AI_SERVICES_PROXY_HTTP_PORT:-8011}:80"
      - "${AI_SERVICES_PROXY_HTTPS_PORT:-8444}:443"
    environment:
      AI_SERVICES_CADDY_HOSTNAME: ${AI_SERVICES_CADDY_HOSTNAME}
      AI_SERVICES_CADDY_EMAIL: ${AI_SERVICES_CADDY_EMAIL}
    volumes:
      - type: bind
        source: ./proxy/Caddyfile.ai-prod
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: caddy_ai_prod_data
        target: /data
      - type: volume
        source: caddy_ai_prod_config
        target: /config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - edge
      - internal

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  caddy_prod_data:
  caddy_prod_config:
  caddy_ai_prod_data:
  caddy_ai_prod_config:

secrets:
  next_server_actions_encryption_key:
    file: ./secrets/prod/next_server_actions_encryption_key.txt
  database_url:
    file: ./secrets/prod/database_url.txt
  stripe_secret_key:
    file: ./secrets/prod/stripe_secret_key.txt
  stripe_webhook_secret:
    file: ./secrets/prod/stripe_webhook_secret.txt
  clerk_secret_key:
    file: ./secrets/prod/clerk_secret_key.txt
  clerk_webhook_signing_secret:
    file: ./secrets/prod/clerk_webhook_signing_secret.txt
