name: ${COMPOSE_PROJECT_NAME:-universe-prod}

x-nextjs-runtime: &nextjs-runtime
  init: true
  restart: unless-stopped
  stop_signal: SIGTERM
  stop_grace_period: 30s
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "require('http').get('http://127.0.0.1:${NEXTJS_PORT:-3000}',res=>process.exit(res.statusCode<500?0:1)).on('error',()=>process.exit(1))",
      ]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  networks:
    - internal
    - edge

services:
  nextjs:
    <<: *nextjs-runtime
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_URL: ${APP_URL}
      AI_SERVICES_URL: ${AI_SERVICES_URL}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES}
      CLERK_TELEMETRY_DISABLED: "${CLERK_PROXY_DEBUG:-0}"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      STRIPE_AUTOMATIC_TAX_ENABLED: "${STRIPE_AUTOMATIC_TAX_ENABLED:-false}"
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET_BEATS: ${S3_BUCKET_BEATS}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in infra/env/stack.prod.env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in infra/env/stack.prod.env}
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-true}"
      NODE_ENV: ${NEXTJS_NODE_ENV:-production}
      NEXT_TELEMETRY_DISABLED: "${NEXTJS_TELEMETRY_DISABLED:-1}"
      HOSTNAME: ${NEXTJS_HOSTNAME:-0.0.0.0}
      PORT: "${NEXTJS_PORT:-3000}"
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?set NEXT_SERVER_ACTIONS_ENCRYPTION_KEY in infra/env/stack.prod.env}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in infra/env/stack.prod.env}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY in infra/env/stack.prod.env}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?set STRIPE_WEBHOOK_SECRET in infra/env/stack.prod.env}
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:?set POSTMARK_SERVER_TOKEN in infra/env/stack.prod.env}
      POSTMARK_FROM_EMAIL: ${POSTMARK_FROM_EMAIL:?set POSTMARK_FROM_EMAIL in infra/env/stack.prod.env}
      POSTMARK_MESSAGE_STREAM: ${POSTMARK_MESSAGE_STREAM:-outbound}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in infra/env/stack.prod.env}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY in infra/env/stack.prod.env}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:?set CLERK_WEBHOOK_SIGNING_SECRET in infra/env/stack.prod.env}
    image: ${NEXTJS_IMAGE:-universe/nextjs}:${NEXTJS_IMAGE_TAG:-prod}
    build:
      context: ${NEXTJS_CONTEXT:-../app}
      dockerfile: ${NEXTJS_DOCKERFILE:-../app/Dockerfile}
      target: runner
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    expose:
      - "${NEXTJS_PORT:-3000}"

  ai-services:
    init: true
    environment:
      PYTHONDONTWRITEBYTECODE: "${AI_SERVICES_PYTHONDONTWRITEBYTECODE:-1}"
      PYTHONUNBUFFERED: "${AI_SERVICES_PYTHONUNBUFFERED:-1}"
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:${AI_SERVICES_PORT:-8000}/health').status < 500 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - internal
      - edge
    image: ${AI_SERVICES_IMAGE:-universe/ai-services}:${AI_SERVICES_IMAGE_TAG:-prod}
    build:
      context: ${AI_SERVICES_CONTEXT:-../ai-services}
      dockerfile: ${AI_SERVICES_DOCKERFILE:-../ai-services/Dockerfile}
      target: runner
    expose:
      - "${AI_SERVICES_PORT:-8000}"
  
  audio-worker:
    image: ${AUDIO_WORKER_IMAGE:-universe/audio-worker}:${AUDIO_WORKER_IMAGE_TAG:-prod}
    build:
      context: ${AUDIO_WORKER_CONTEXT:-../audio-worker}
      dockerfile: ${AUDIO_WORKER_DOCKERFILE:-../audio-worker/Dockerfile}
      target: runtime
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in infra/env/stack.prod.env}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET_BEATS: ${S3_BUCKET_BEATS}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in infra/env/stack.prod.env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in infra/env/prod.prod.env}
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-true}"
      AUDIO_WORKER_ID: ${AUDIO_WORKER_ID:-prod-audio-worker-1}
      AUDIO_WORKER_POLL_INTERVAL_MS: ${AUDIO_WORKER_POLL_INTERVAL_MS:-2000}
      AUDIO_WORKER_TMP_DIR: ${AUDIO_WORKER_TMP_DIR:-/tmp/universe-audio-worker}
      RUST_LOG: ${AUDIO_WORKER_RUST_LOG:-info}
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${AUDIO_WORKER_TMPFS_SIZE:-1g}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge
      - internal

  proxy:
    image: caddy:2.10-alpine
    init: true
    depends_on:
      nextjs:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /var/run:rw,noexec,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "${NEXTJS_PROXY_HTTP_PORT:-8080}:80"
    volumes:
      - type: bind
        source: ./proxy/Caddyfile.prod
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: caddy_prod_data
        target: /data
      - type: volume
        source: caddy_prod_config
        target: /config
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:80" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge
      - internal

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  caddy_prod_data:
  caddy_prod_config:
