name: ${COMPOSE_PROJECT_NAME:-universe-dev}

services:
  postgres:
    image: postgres:18-alpine
    init: true
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-universe_dev}
      POSTGRES_USER: ${POSTGRES_USER:-universe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-universe_dev_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - type: volume
        source: postgres_dev_data
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - edge

  nextjs:
    build:
      context: ${NEXTJS_CONTEXT:-../app}
      dockerfile: ${NEXTJS_DOCKERFILE:-../app/Dockerfile}
      target: dev
    init: true
    working_dir: /app
    ports:
      - "${NEXTJS_PORT:-3000}:3000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_URL: ${APP_URL:-http://localhost:3000}
      AI_SERVICES_URL: ${AI_SERVICES_URL:-http://localhost:8000}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-http://localhost:3000}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET}
      NODE_ENV: ${NEXTJS_NODE_ENV:-development}
      NEXT_TELEMETRY_DISABLED: "${NEXTJS_TELEMETRY_DISABLED:-1}"
      HOSTNAME: ${NEXTJS_HOSTNAME:-0.0.0.0}
      PORT: "${NEXTJS_PORT:-3000}"
      WATCHPACK_POLLING: "${NEXTJS_WATCHPACK_POLLING:-true}"
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:${NEXTJS_PORT:-3000}',res=>process.exit(res.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    develop:
      watch:
        - path: ${NEXTJS_CONTEXT:-../app}/src
          action: sync
          target: /app/src
          initial_sync: true
          ignore:
            - node_modules/
            - .next/
        - path: ${NEXTJS_CONTEXT:-../app}/public
          action: sync
          target: /app/public
          initial_sync: true
        - path: ${NEXTJS_CONTEXT:-../app}/package.json
          action: rebuild
        - path: ${NEXTJS_CONTEXT:-../app}/package-lock.json
          action: rebuild
        - path: ${NEXTJS_CONTEXT:-../app}/next.config.ts
          action: rebuild
        - path: ${NEXTJS_CONTEXT:-../app}/prisma
          action: rebuild
        - path: ${NEXTJS_CONTEXT:-../app}/tsconfig.json
          action: rebuild
    networks:
      - edge
      
  ai-services:
    build:
      context: ${AI_SERVICES_CONTEXT:-../ai-services}
      dockerfile: ${AI_SERVICES_DOCKERFILE:-../ai-services/Dockerfile}
      target: dev
    init: true
    working_dir: /app
    ports:
      - "${AI_SERVICES_PORT:-8000}:${AI_SERVICES_PORT:-8000}"
    environment:
      PYTHONDONTWRITEBYTECODE: "${AI_SERVICES_PYTHONDONTWRITEBYTECODE:-1}"
      PYTHONUNBUFFERED: "${AI_SERVICES_PYTHONUNBUFFERED:-1}"
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:${AI_SERVICES_PORT:-8000}/health').status < 500 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    develop:
      watch:
        - path: ${AI_SERVICES_CONTEXT:-../ai-services}
          action: sync
          target: /app
          initial_sync: true
          ignore:
            - .venv/
            - __pycache__/
            - .pytest_cache/
            - .ruff_cache/
            - dist/
            - build/
            - "*.egg-info/"
            - uv.lock
            - pyproject.toml
        - path: ${AI_SERVICES_CONTEXT:-../ai-services}/pyproject.toml
          action: rebuild
        - path: ${AI_SERVICES_CONTEXT:-../ai-services}/uv.lock
          action: rebuild
    networks:
      - edge

networks:
  edge:
    driver: bridge

volumes:
  postgres_dev_data:
