name: ${COMPOSE_PROJECT_NAME:-universe-dev}

services:
  postgres:
    image: postgres:18-alpine
    init: true
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-universe_dev}
      POSTGRES_USER: ${POSTGRES_USER:-universe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-universe_dev_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - type: volume
        source: postgres_dev_data
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - edge

  nextjs:
    build:
      context: ${NEXTJS_CONTEXT:-../app}
      dockerfile: ${NEXTJS_DOCKERFILE:-../app/Dockerfile}
      target: dev
    init: true
    working_dir: /app
    ports:
      - "${NEXTJS_HOST_PORT:-3000}:${NEXTJS_PORT:-3000}"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_URL: ${APP_URL:-http://localhost:3000}
      AI_SERVICES_URL: ${AI_SERVICES_URL:-http://localhost:8000}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-http://localhost:3000}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-development}
      CLERK_TELEMETRY_DISABLED: "${CLERK_TELEMETRY_DISABLED:-1}"
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_AUTOMATIC_TAX_ENABLED: "${STRIPE_AUTOMATIC_TAX_ENABLED:-false}"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_EMAIL_FROM: ${RESEND_EMAIL_FROM:-}
      CRON_SECRET: ${CRON_SECRET:-}
      CRON_ALLOWED_IPS: ${CRON_ALLOWED_IPS:-127.0.0.1}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      REDIS_API_GLOBAL: ${REDIS_API_GLOBAL:-300}
      REDIS_ACCOUNT_WRITE: ${REDIS_ACCOUNT_WRITE:-20}
      REDIS_STORAGE_PRESIGN: ${REDIS_STORAGE_PRESIGN:-30}
      REDIS_MARKETPLACE_WRITE: ${REDIS_MARKETPLACE_WRITE:-30}
      REDIS_MARKETPLACE_READ: ${REDIS_MARKETPLACE_READ:-120}
      REDIS_ANALYTICS_WRITE: ${REDIS_ANALYTICS_WRITE:-240}
      REDIS_CHAT_WRITE: ${REDIS_CHAT_WRITE:-60}
      REDIS_CHAT_READ: ${REDIS_CHAT_READ:-180}
      REDIS_PUBLIC_ENUMERATION: ${REDIS_PUBLIC_ENUMERATION:-120}
      REDIS_ACCOUNT_TEST_BURST: ${REDIS_ACCOUNT_TEST_BURST:-8}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET_BEATS: ${S3_BUCKET_BEATS:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-true}"
      SEED_BEAT_COUNT: ${SEED_BEAT_COUNT:-500}
      SEED_SELLER_COUNT: ${SEED_SELLER_COUNT:-40}
      SEED_ANALYTICS_EVENTS: ${SEED_ANALYTICS_EVENTS:-50000}
      SEED_BUYER_COUNT: ${SEED_BUYER_COUNT:-8}
      SEED_RANDOM_SEED: ${SEED_RANDOM_SEED:-20260605}
      SEED_AUDIO_BUCKET: ${SEED_AUDIO_BUCKET:-}
      SEED_AUDIO_OBJECT_KEY: ${SEED_AUDIO_OBJECT_KEY:-}
      NODE_ENV: ${NEXTJS_NODE_ENV:-development}
      NEXT_TELEMETRY_DISABLED: "${NEXTJS_TELEMETRY_DISABLED:-1}"
      HOSTNAME: ${NEXTJS_HOSTNAME:-0.0.0.0}
      PORT: "${NEXTJS_PORT:-3000}"
      WATCHPACK_POLLING: "${NEXTJS_WATCHPACK_POLLING:-true}"
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:${NEXTJS_PORT:-3000}',res=>process.exit(res.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    develop:
      watch:
        - path: ${NEXTJS_CONTEXT:-../app}/src
          action: sync
          target: /app/src
          initial_sync: true
          ignore:
            - node_modules/
            - .next/
        - path: ${NEXTJS_CONTEXT:-../app}/public
          action: sync
          target: /app/public
          initial_sync: true
        - path: ${NEXTJS_CONTEXT:-../app}/package.json
          action: rebuild
        - path: ${NEXTJS_CONTEXT:-../app}/package-lock.json
          action: rebuild
        - path: ${NEXTJS_CONTEXT:-../app}/next.config.ts
          action: rebuild
        - path: ${NEXTJS_CONTEXT:-../app}/prisma
          action: rebuild
        - path: ${NEXTJS_CONTEXT:-../app}/tsconfig.json
          action: rebuild
    networks:
      - edge
      
  ai-services:
    build:
      context: ${AI_SERVICES_CONTEXT:-../ai-services}
      dockerfile: ${AI_SERVICES_DOCKERFILE:-../ai-services/Dockerfile}
      target: dev
    init: true
    working_dir: /app
    ports:
      - "${AI_SERVICES_PORT:-8000}:${AI_SERVICES_PORT:-8000}"
    environment:
      PYTHONDONTWRITEBYTECODE: "${AI_SERVICES_PYTHONDONTWRITEBYTECODE:-1}"
      PYTHONUNBUFFERED: "${AI_SERVICES_PYTHONUNBUFFERED:-1}"
      AI_SERVICES_API_KEY: ${AI_SERVICES_API_KEY:-}
      AI_SERVICES_ALLOWED_ORIGINS: ${AI_SERVICES_ALLOWED_ORIGINS:-}
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:${AI_SERVICES_PORT:-8000}/health').status < 500 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    develop:
      watch:
        - path: ${AI_SERVICES_CONTEXT:-../ai-services}
          action: sync
          target: /app
          initial_sync: true
          ignore:
            - .venv/
            - __pycache__/
            - .pytest_cache/
            - .ruff_cache/
            - dist/
            - build/
            - "*.egg-info/"
            - uv.lock
            - pyproject.toml
        - path: ${AI_SERVICES_CONTEXT:-../ai-services}/pyproject.toml
          action: rebuild
        - path: ${AI_SERVICES_CONTEXT:-../ai-services}/uv.lock
          action: rebuild
    networks:
      - edge

  audio-worker:
    build:
      context: ${AUDIO_WORKER_CONTEXT:-../audio-worker}
      dockerfile: ${AUDIO_WORKER_DOCKERFILE:-../audio-worker/Dockerfile}
      target: dev
    init: true
    working_dir: /app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET_BEATS: ${S3_BUCKET_BEATS:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-true}"
      AUDIO_WORKER_POLL_INTERVAL_MS: ${AUDIO_WORKER_POLL_INTERVAL_MS:-2000}
      RUST_LOG: ${AUDIO_WORKER_RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    develop:
      watch:
        - path: ${AUDIO_WORKER_CONTEXT:-../audio-worker}/src
          action: sync
          target: /app/src
          initial_sync: true
        - path: ${AUDIO_WORKER_CONTEXT:-../audio-worker}/Cargo.toml
          action: rebuild
        - path: ${AUDIO_WORKER_CONTEXT:-../audio-worker}/Cargo.lock
          action: rebuild
    networks:
      - edge

  redis:
    image: redis:8.6.3
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    restart: unless-stopped
    networks:
      - edge
      

networks:
  edge:
    driver: bridge

volumes:
  postgres_dev_data:
  redis-data:
    driver: local
