name: ${COMPOSE_PROJECT_NAME:-universe-ai-dev}

services:
  ai-services:
    build:
      context: ${AI_SERVICES_CONTEXT:-../ai-services}
      dockerfile: ${AI_SERVICES_DOCKERFILE:-../ai-services/Dockerfile}
      target: dev
    init: true
    working_dir: /app
    ports:
      - "${AI_SERVICES_PORT:-8000}:8000"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status < 500 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    develop:
      watch:
        - path: ${AI_SERVICES_CONTEXT:-../ai-services}
          action: sync
          target: /app
          initial_sync: true
          ignore:
            - .venv/
            - __pycache__/
            - .pytest_cache/
            - .ruff_cache/
            - dist/
            - build/
            - "*.egg-info/"
            - uv.lock
            - pyproject.toml
        - path: ${AI_SERVICES_CONTEXT:-../ai-services}/pyproject.toml
          action: rebuild
        - path: ${AI_SERVICES_CONTEXT:-../ai-services}/uv.lock
          action: rebuild
    networks:
      - edge

networks:
  edge:
    driver: bridge
